[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myagent"
version = "0.1.6"
description = "PaperFox builds experiment reports from existing materials"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
pdf = ["PyMuPDF>=1.24", "reportlab>=4"]
paperfox = [
    "openai==2.45.0", "PyMuPDF==1.28.0", "reportlab==5.0.1",
    "PyYAML==6.0.3", "matplotlib==3.10.6", "Pillow==12.3.0",
    "python-pptx==1.0.2", "rapidocr-onnxruntime==1.4.4",
]
lab = ["PyMuPDF>=1.24", "reportlab>=4", "PyYAML>=6", "numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7", "Pillow>=10"]

[project.scripts]
myagent = "myagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
myagent = ["prompts/*.md", "web_static/*", "skill_library/*/SKILL.md", "*.mjs", "*.ps1", "writing_profile.json", "default_report_template.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "bronze: required for the in-class walking skeleton",
    "silver: post-class session/resume",
    "gold: optional compaction and extensions",
]
